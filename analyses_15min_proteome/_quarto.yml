project:
  type: default
  output-dir: _output

execute:
  echo: true
  warning: false
  message: false
  freeze: false

format:
  html:
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    embed-resources: true
    fig-width: 8
    fig-height: 5
    df-print: kable
    include-before-body:
      - assets/fgcz_header_quarto.html
      - assets/fgcz_banner_override.html
